name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax and lint
        run: |
          bash -n setup.sh
          shellcheck setup.sh scripts/*.sh
      - name: CLAUDE.md rules are identical in setup.sh and setup.ps1
        run: bash scripts/check-rules-sync.sh
      - name: Claude PreToolUse guard hook unit tests
        run: bash scripts/test-agy-guard.sh
      - name: PowerShell syntax
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/setup.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
